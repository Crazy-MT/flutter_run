<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif;color:#182031;background:#edf0f5;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #69a5ff;outline-offset:2px}.page{max-width:1550px;margin:auto;padding:38px 42px 70px}.eyebrow{font-size:11px;letter-spacing:.16em;font-weight:750;color:#707c90}.intro{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin:12px 0 25px}.intro h1{font-size:30px;letter-spacing:-.04em;margin:0 0 8px}.intro p{margin:0;color:#788394;font-size:14px}.intro .demo{white-space:nowrap;color:#8d96a5;font-size:12px}.chooser{display:flex;gap:9px;padding:5px;border-radius:14px;background:#e1e6ed;width:max-content;max-width:100%;margin-bottom:23px}.choice{border:0;background:transparent;color:#738092;border-radius:10px;padding:10px 17px;font-weight:650;font-size:13px}.choice.active{color:#1c2738;background:#fff;box-shadow:0 2px 8px #26384b16}.choice span{color:#a3acba;font-weight:500;margin-left:7px}.summary{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.summary strong{font-size:15px}.summary p{display:inline;margin-left:14px;color:#7b8695;font-size:12px}.summary .badge{font-size:11px;color:#6b7789;background:#fff;border:1px solid #dfe5ec;padding:7px 10px;border-radius:8px}.screen{display:none}.screen.active{display:block}.window{height:750px;border-radius:15px;overflow:hidden;background:#fff;box-shadow:0 30px 85px #293a5c21,0 2px 8px #293a5c14;border:1px solid #dfe4eb}.titlebar{height:46px;display:flex;align-items:center;gap:18px;padding:0 18px;border-bottom:1px solid var(--border);background:var(--chrome);color:var(--muted);font-size:12px}.traffic{display:flex;gap:7px}.traffic i{width:11px;height:11px;border-radius:50%;background:#ff5f57}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}.titlebar .appname{font-weight:700;color:var(--text)}.titlebar .crumb{color:var(--muted)}.titlebar .right{margin-left:auto;display:flex;align-items:center;gap:14px}.dot{width:7px;height:7px;background:#30bb89;border-radius:50%;display:inline-block;flex:none}.app{height:calc(100% - 46px);display:flex;background:var(--bg);color:var(--text)}.side{width:231px;flex:none;border-right:1px solid var(--border);background:var(--side);padding:22px 14px;display:flex;flex-direction:column}.side-title{font-size:10px;color:var(--muted);font-weight:750;letter-spacing:.1em;margin:17px 9px 10px}.side-title:first-child{margin-top:0}.project{border:1px solid var(--border);border-radius:10px;padding:11px 10px;display:flex;align-items:center;gap:10px;background:var(--panel)}.project .project-icon{width:31px;height:31px;display:grid;place-items:center;border-radius:8px;background:#e9f2ff;color:#3980e8;font-weight:800;font-size:17px}.project strong,.device-info strong{font-size:12px;display:block}.project small,.device-info small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;text-align:left;background:transparent;color:var(--muted);border-radius:8px;padding:9px;font-size:12px}.nav-btn.selected{background:var(--active);color:var(--accent);font-weight:700}.nav-btn .nicon{width:17px;font-size:15px;text-align:center}.count{margin-left:auto;font-size:10px;color:var(--muted)}.device{border:0;text-align:left;width:100%;background:transparent;color:var(--text);display:flex;gap:10px;align-items:center;padding:10px 9px;border-radius:9px}.device.selected{background:var(--active)}.device .glyph{font-size:17px;color:var(--accent);width:23px}.device .device-info{flex:1;min-width:0}.device .device-info strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.device .dot{width:6px;height:6px}.add{border:1px dashed var(--border);background:none;color:var(--muted);border-radius:8px;padding:9px;font-size:11px;margin-top:8px}.bottom{margin-top:auto;border-top:1px solid var(--border);padding:14px 9px 0;color:var(--muted);font-size:11px}.bottom b{color:var(--text);display:block;margin-bottom:5px}.main{flex:1;min-width:0;display:flex;flex-direction:column}.top{padding:22px 28px 18px;border-bottom:1px solid var(--border)}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center}.overline{font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-bottom:7px}.heading{font-size:22px;letter-spacing:-.035em;font-weight:750;display:flex;align-items:center;gap:10px}.live{font-size:10px;font-weight:700;letter-spacing:.03em;color:#19885f;background:#dff6eb;border-radius:6px;padding:5px 7px}.subline{font-size:11px;color:var(--muted);margin-top:7px}.tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.tool{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:8px 11px;font-size:11px;font-weight:650;white-space:nowrap}.tool.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.tool .ico{font-size:13px;margin-right:5px}.tabs{display:flex;gap:23px;padding:0 28px;border-bottom:1px solid var(--border);height:46px;align-items:stretch}.tab{border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);font-size:12px;font-weight:600;padding:0 1px}.tab.selected{border-color:var(--accent);color:var(--accent)}.tab .pill{border-radius:4px;background:var(--active);padding:2px 5px;font-size:9px;margin-left:4px}.content{padding:20px 28px;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}.panel{background:var(--panel);border:1px solid var(--border);border-radius:11px;overflow:hidden}.panel-head{height:46px;display:flex;align-items:center;gap:10px;padding:0 15px;border-bottom:1px solid var(--border);font-size:12px;font-weight:700}.panel-head .muted{font-weight:400;color:var(--muted);font-size:11px}.panel-head .spacer{flex:1}.mini{border:1px solid var(--border);background:var(--panel);border-radius:6px;color:var(--muted);padding:5px 8px;font-size:10px}.filter{height:45px;display:flex;align-items:center;gap:9px;padding:0 14px;border-bottom:1px solid var(--border);color:var(--muted);font-size:11px}.search{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:7px 10px;min-width:190px}.loglines{font:11px/2.15 ui-monospace,SFMono-Regular,Menlo,monospace;padding:12px 15px 16px;color:var(--log);overflow:hidden;white-space:nowrap}.loglines .time{color:var(--muted);margin-right:13px}.loglines .level{display:inline-block;width:26px;color:#30a77e;font-weight:700}.loglines .level.warn{color:#db9a31}.loglines .tag{color:var(--accent)}.footer{margin-top:auto;height:30px;border-top:1px solid var(--border);display:flex;align-items:center;gap:17px;padding:0 15px;font-size:10px;color:var(--muted);background:var(--panel)}.footer .right{margin-left:auto}.hint{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:11px}.hint b{color:var(--text)}.inspector{display:grid;grid-template-columns:220px 1fr;min-height:230px}.tree{border-right:1px solid var(--border);padding:14px;font:11px/2 ui-monospace,monospace;color:var(--log)}.tree .selected{background:var(--active);color:var(--accent);border-radius:5px;padding:2px 5px}.details{padding:18px;font-size:12px;color:var(--muted)}.details b{display:block;color:var(--text);margin-bottom:12px}.kv{display:grid;grid-template-columns:120px 1fr;gap:10px;font-size:11px}.tabsurface{display:none}.tabsurface.selected{display:flex;flex-direction:column;gap:14px;flex:1;min-height:0}.logpanel{flex:1;min-height:0}.toast{position:fixed;right:26px;bottom:24px;background:#182031;color:white;border-radius:10px;padding:11px 15px;font-size:12px;box-shadow:0 10px 30px #0003;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}
.loglines .log-row{display:flex;gap:0;align-items:baseline;min-width:max-content}.loglines .log-row .level{width:55px;flex:none;font-size:10px;font-weight:750;letter-spacing:.02em}.loglines .log-row .tag{width:75px;flex:none}.loglines .log-row.debug{color:#667588}.loglines .log-row.info{color:#277e68}.loglines .log-row.warn{color:#ad761a}.loglines .log-row.error{color:#d04d53}.loglines .log-row.verbose{color:#9299a5}.loglines .log-row .level,.loglines .log-row .tag{color:inherit}.loglines .message{font-family:ui-monospace,SFMono-Regular,Menlo,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",monospace}.c .loglines .log-row.debug{color:#91a8c1}.c .loglines .log-row.info{color:#78cdb0}.c .loglines .log-row.warn{color:#efc477}.c .loglines .log-row.error{color:#ff8f94}.c .loglines .log-row.verbose{color:#8392a4}
/* A: precision workspace */
.a{--bg:#f7f9fc;--side:#fff;--panel:#fff;--border:#e8edf3;--text:#202b3b;--muted:#96a1af;--accent:#387fe9;--active:#eaf2ff;--chrome:#fbfcfe;--log:#566475}.a .main{background:#f7f9fc}.a .content .logpanel{box-shadow:0 3px 14px #1d385008}.a .side-title{color:#a1adbb}.a .tool.primary{background:#357ee8}.a .top{background:#fff}

/* C: observability console */
.c{--bg:#121923;--side:#171f2a;--panel:#1b2531;--border:#2b3745;--text:#e7edf3;--muted:#8696a8;--accent:#59c8b1;--active:#233b3e;--chrome:#151c25;--log:#a4b4c2}.c .titlebar{border-bottom:1px solid #2b3745}.c .side{width:224px}.c .project{background:#1e2b38}.c .project .project-icon{background:#21453f;color:#6ee2c8}.c .heading{font-size:20px}.c .top{background:#171f2a}.c .tool{background:#25313d}.c .tool.primary{background:#52c5ab;border-color:#52c5ab;color:#102620}.c .live{background:#213c36;color:#69d6b7}.c .content{background:#121923}.c .tabs{background:#171f2a}.c .loglines{font-size:11px}.c .logpanel{background:#141c25}.c .search{background:#151e28}.c .footer{background:#171f2a}.c .panel-head .mini{background:#24313d}.c .dot{background:#6ee4b1}

</head><body>
<div class="page"><div class="eyebrow">FLUTTER RUN · DESIGN EXPLORATION</div><div class="intro"><div><h1>选择你喜欢的工作界面</h1><p>同一套功能，三种不同的使用感受。点击切换方案，也可以体验设备与面板切换。</p></div><div class="demo">交互原型 · 示例数据，不连接真实设备</div></div>
<nav class="chooser" aria-label="设计方案"><button class="choice active" data-choice="a">01 工作台 <span>清晰高效</span></button><button class="choice" data-choice="b">02 原生轻盈 <span>柔和简洁</span></button><button class="choice" data-choice="c">03 深色控制台 <span>专注调试</span></button></nav>
<div id="screens"></div>
</div><div class="toast" role="status" aria-live="polite"></div>
<script>
const plans=[{key:'a',title:'01 / 清晰工作台',desc:'信息层级明确，设备与日志并排管理，适合日常长时间使用。',badge:'推荐 · 清晰高效'},{key:'b',title:'02 / 原生轻盈',desc:'更接近桌面原生应用，低对比度和大留白，操作更轻松。',badge:'柔和 · 原生感'},{key:'c',title:'03 / 深色控制台',desc:'深色界面突出日志与运行状态，适合长时间调试。',badge:'深色 · 专注'}];
const icons={run:'▶',reload:'↻',restart:'⟳',stop:'■'};
const lines=[
 ['15:42:07.920','V','verbose','engine','Preparing rendering pipeline…'],
 ['15:42:08.214','D','debug','flutter','🔎 Debug session connected'],
 ['15:42:08.346','I','info','flutter','🚀 Application started successfully'],
 ['15:42:09.012','I','info','app','✅ 用户会话已初始化'],
 ['15:42:09.286','D','debug','network','Request GET /api/member · 200'],
 ['15:42:10.031','W','warn','network','⚠️ Request completed with cached response'],
 ['15:42:11.443','E','error','app','❌ Payment service temporarily unavailable'],
 ['15:42:14.108','I','info','flutter','🎉 Ready for hot reload']
];
function logs(){return lines.map(l=>`<div class="log-row ${l[2]}"><span class="time">${l[0]}</span><span class="level">${l[2].toUpperCase()}</span><span class="tag">${l[3]}</span><span class="message">${l[4]}</span></div>`).join('')}
function make(p){return `<section class="screen ${p.key==='a'?'active':''}" data-screen="${p.key}"><div class="summary"><div><strong>${p.title}</strong><p>${p.desc}</p></div><span class="badge">${p.badge}</span></div><div class="window ${p.key}"><div class="titlebar"><div class="traffic"><i></i><i></i><i></i></div><span class="appname">Flutter Run</span><span class="crumb">/　mspay_flutter</span><div class="right"><span><span class="dot"></span>　2 个会话运行中</span><span>⌘ K</span></div></div><div class="app"><aside class="side"><div class="side-title">当前项目</div><div class="project"><span class="project-icon">◆</span><div><strong>mspay_flutter</strong><small>~/project/mspay_flutter</small></div></div><div class="side-title">工作空间</div><button class="nav-btn selected" data-panel="logs"><span class="nicon">▤</span>运行与调试 <span class="count">⌘ 1</span></button><button class="nav-btn" data-panel="inspector"><span class="nicon">⌘</span>Flutter Inspector <span class="count">⌘ 2</span></button><button class="nav-btn" data-panel="logcat"><span class="nicon">≡</span>Logcat <span class="count">⌘ 3</span></button><div class="side-title">设备 <span style="float:right">2 / 3</span></div><button class="device selected" data-device="phone"><span class="glyph">▯</span><span class="device-info"><strong>Pixel 8 Pro</strong><small>Android 15 · USB</small></span><i class="dot"></i></button><button class="device" data-device="emulator"><span class="glyph">▣</span><span class="device-info"><strong>Pixel 9 Emulator</strong><small>Android 15 · 模拟器</small></span><i class="dot"></i></button><button class="device" data-device="mac"><span class="glyph">▱</span><span class="device-info"><strong>macOS</strong><small>桌面设备</small></span><i class="dot" style="background:#b9c1ca"></i></button><button class="add" data-action="启动模拟器">＋　启动模拟器</button><div class="bottom"><b>Flutter SDK　<span style="color:#32ae7f">●</span></b>3.47.9 · 已就绪</div></aside><main class="main"><header class="top"><div class="topline"><div><div class="overline">运行会话 / <span data-device-name>PIXEL 8 PRO</span></div><div class="heading"><span data-heading>Pixel 8 Pro</span><span class="live" data-state>● 运行中</span></div><div class="subline" data-device-desc>Android 15　·　USB 已连接　·　Debug 模式</div></div><div class="tools"><button class="tool primary" data-action="运行"><span class="ico">${icons.run}</span>运行</button><button class="tool" data-action="热重载"><span class="ico">${icons.reload}</span>热重载</button><button class="tool" data-action="热重启"><span class="ico">${icons.restart}</span>热重启</button><button class="tool" data-action="停止"><span class="ico">${icons.stop}</span>停止</button></div></div></header><div class="tabs"><button class="tab selected" data-panel="logs">运行日志 <span class="pill">LIVE</span></button><button class="tab" data-panel="inspector">Inspector</button><button class="tab" data-panel="logcat">Logcat</button></div><div class="content"><div class="tabsurface selected" data-surface="logs"><div class="hint"><span class="dot"></span>　正在查看 <b data-current>Pixel 8 Pro</b> 的运行会话 <span style="margin-left:auto">会话已运行 02:36</span></div><div class="panel logpanel"><div class="panel-head"><span>运行日志</span><span class="muted">实时输出</span><span class="spacer"></span><button class="mini" data-action="清空日志">清空</button><button class="mini" data-action="暂停日志">暂停</button><button class="mini" data-action="更多操作">•••</button></div><div class="filter"><span class="search">⌕　搜索日志</span><span>所有级别　⌄</span><span style="margin-left:auto">自动滚动　●</span></div><div class="loglines">${logs()}</div></div></div><div class="tabsurface" data-surface="logcat"><div class="hint"><span class="dot"></span>　Android 设备日志 · <b data-current>Pixel 8 Pro</b></div><div class="panel logpanel"><div class="panel-head">Logcat <span class="muted">Android 系统日志</span><span class="spacer"></span><button class="mini" data-action="清空日志">清空</button><button class="mini" data-action="暂停日志">暂停</button></div><div class="filter"><span class="search">⌕　搜索标签或内容</span><span>Info 及以上　⌄</span><span style="margin-left:auto">自动滚动　●</span></div><div class="loglines">${logs()}</div></div></div><div class="tabsurface" data-surface="inspector"><div class="hint"><span class="dot"></span>　已连接到 <b data-current>Pixel 8 Pro</b> 的调试服务</div><div class="panel logpanel"><div class="panel-head">Flutter Inspector <span class="muted">官方 DevTools · 内嵌视图</span><span class="spacer"></span><button class="mini" data-action="选择组件">⌖　选择组件</button></div><div class="inspector"><div class="tree">⌄ [root]<br>　⌄ MyApp<br>　　⌄ MaterialApp<br>　　　⌄ HomePage<br><span class="selected">　　　　Scaffold</span><br>　　　　　AppBar<br>　　　　　Column<br>　　　　　　Text</div><div class="details"><b>Scaffold</b><div class="kv"><span>type</span><span>Scaffold</span><span>backgroundColor</span><span>Color(0xffffffff)</span><span>body</span><span>Column</span><span>appBar</span><span>AppBar</span></div></div></div></div></div></div><div class="footer"><span><span class="dot"></span>　Flutter 3.47.9</span><span>●　2 个设备运行中</span><span>SDK 已连接</span><span class="right">状态栏快捷操作　↗</span></div></main></div></div></section>`}
document.getElementById('screens').innerHTML=plans.map(make).join('');
const deviceData={phone:['Pixel 8 Pro','Android 15　·　USB 已连接　·　Debug 模式','● 运行中'],emulator:['Pixel 9 Emulator','Android 15　·　模拟器　·　Debug 模式','● 运行中'],mac:['macOS','桌面设备　·　Apple Silicon','○ 未运行']};
document.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('active',x===choice));document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('active',x.dataset.screen===choice.dataset.choice));return}const el=e.target.closest('button');if(!el)return;const screen=el.closest('.screen');if(!screen)return;if(el.dataset.device){const d=deviceData[el.dataset.device];screen.querySelectorAll('.device').forEach(x=>x.classList.toggle('selected',x===el));screen.querySelector('[data-heading]').textContent=d[0];screen.querySelector('[data-device-name]').textContent=d[0].toUpperCase();screen.querySelector('[data-device-desc]').textContent=d[1];screen.querySelector('[data-state]').textContent=d[2];screen.querySelectorAll('[data-current]').forEach(x=>x.textContent=d[0]);return}if(el.dataset.panel){screen.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('selected',x.dataset.panel===el.dataset.panel));screen.querySelectorAll('[data-surface]').forEach(x=>x.classList.toggle('selected',x.dataset.surface===el.dataset.panel));return}if(el.dataset.action){const toast=document.querySelector('.toast');toast.textContent=`${el.dataset.action} · 原型演示，不会操作真实设备`;toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),2200)}});
</script></body></html>
